<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>360° 展示 · 娃衣小筑</title><link rel="stylesheet" href="style.css?v=12"><link rel="stylesheet" href="font-fix.css"><style>main{max-width:1100px;margin:30px auto;padding:0 20px}.viewer-shell{background:#fff8eeed;border:1px solid #fff6e6;border-radius:26px;padding:24px}h1{font-size:28px;letter-spacing:1px;color:#ac7286;margin:5px 0 16px}.orbit-stage{position:relative;height: min(66vh,660px);min-height:340px;border-radius:20px;background:linear-gradient(#fff1dd50,#fff1dd50),url('assets/atelier.png') center/cover;overflow:hidden}model-viewer{width:100%;height:100%;--progress-bar-color:#b4768b}model-viewer:not([src]){visibility:hidden}.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff5e685;backdrop-filter:blur(4px);padding:24px}.empty-state[hidden]{display:none}.empty-state img{width:95px}.empty-state h2{font-size:24px;filter:none;text-shadow:none;-webkit-text-stroke:0}.empty-state p{font-size:13px;margin:4px 0}.viewer-actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:18px 0 5px}.viewer-actions button,.upload-label{font:14px DollRoundFixed,sans-serif;border-radius:22px;padding:10px 18px}.upload-label{background:#a66d7c;color:white;cursor:pointer;margin:0}.upload-label:focus-within{outline:3px solid #c69c78;outline-offset:3px}.upload-label input{position:absolute;width:1px;height:1px;opacity:0;padding:0}button:disabled{opacity:.5;cursor:not-allowed}#viewer-status,.hint{font:12px/1.8 'Microsoft YaHei',sans-serif;color:#796452}.hint{margin:5px 0}#viewer-status{min-height:22px}header nav{gap:20px}@media(max-width:650px){.viewer-shell{padding:16px}.orbit-stage{height:55vh}.empty-state p{font-size:12px}}</style><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js" onerror="document.querySelector('#viewer-status').textContent='旋转组件加载失败，请联网刷新。'"></script><link rel="stylesheet" href="garden.css?v=1"></head><body><header><a class="brand" href="index.html"><img class="dragon" src="assets/companion.svg" alt="布偶女孩">娃衣小筑</a><a href="index.html#collection">返回图片展示</a></header><main><div class="viewer-shell"><h1>360° 自由旋转</h1><div class="preview-pages"><a href="index.html#collection">正侧背面</a><span aria-current="page">360° 展示</span></div><div class="orbit-stage"><model-viewer id="viewer" alt="导入的娃娃三维模型" camera-controls touch-action="none" disable-pan min-camera-orbit="auto 0deg 105%" max-camera-orbit="auto 180deg 220%" camera-orbit="0deg 75deg 125%" shadow-intensity="0.6" interaction-prompt="none"></model-viewer><div class="empty-state" id="empty-state"><img src="assets/companion.svg" alt="布偶女孩"><h2>等一位立体小伙伴</h2><p>导入娃娃模型后，可连续环绕、俯视与仰视。</p><p>尚未接入实物模型，当前没有旋转示例。</p></div></div><div class="viewer-actions"><label class="upload-label">导入模型<input id="model-file" type="file" accept=".glb" aria-label="导入单文件 GLB 模型"></label><button id="spin" disabled aria-pressed="false">自动旋转</button><button id="reset" disabled>恢复全身视角</button></div><p id="viewer-status" role="status">请选择包含材质贴图的单文件模型（.glb）。</p><p class="hint">拖动旋转 · 双指或滚轮缩放 · 模型仅在本机读取</p><p class="hint">查看器需联网加载。模型尺寸未经实测校准，不用于合身判断。</p></div></main><script src="viewer.js"></script><script src="companion.js?v=1"></script></body></html>
